name: x402-oracle-swarm

x-runtime: &runtime
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  networks:
    - private
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "5"

services:
  oracle:
    <<: *runtime
    build:
      context: ../..
      dockerfile: Dockerfile
    image: x402-oracle:local
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      SWARM_PUBLIC_URL: ${SWARM_PUBLIC_URL:?SWARM_PUBLIC_URL is required}
      X402_PAY_TO: ${X402_PAY_TO:?X402_PAY_TO is required}
      X402_NETWORK: ${X402_NETWORK:-eip155:8453}
      X402_FACILITATOR_URL: ${X402_FACILITATOR_URL:?X402_FACILITATOR_URL is required}
      X402_FACILITATOR_URL_FALLBACK: ${X402_FACILITATOR_URL_FALLBACK:-}
      CDP_API_KEY_ID: ${CDP_API_KEY_ID:?CDP_API_KEY_ID is required}
      CDP_API_KEY_SECRET: ${CDP_API_KEY_SECRET:?CDP_API_KEY_SECRET is required}
      MAX_PRICE_USD: ${MAX_PRICE_USD:-25}
      DEMO_MODE: "false"
      ORACLE_LLM_API_KEY: ${ORACLE_LLM_API_KEY:-}
      ORACLE_LLM_BASE_URL: ${ORACLE_LLM_BASE_URL:-}
      ORACLE_LLM_MODEL: ${ORACLE_LLM_MODEL:-}
      PORT: "3001"
      HOSTNAME: 0.0.0.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      - private
      - edge
    expose:
      - "3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    cpus: 1.0
    mem_limit: 768m

  swarm:
    <<: *runtime
    build:
      context: ${SWARM_BUILD_CONTEXT:-../../../x402-crediting-swarm}
      dockerfile: Dockerfile
    image: x402-crediting-swarm:local
    environment:
      X402_NETWORK: ${X402_NETWORK:-eip155:8453}
      X402_PAY_TO_ADDRESS: ${X402_PAY_TO:?X402_PAY_TO is required}
      X402_FACILITATOR_URL: ${X402_FACILITATOR_URL:?X402_FACILITATOR_URL is required}
      CDP_API_KEY_ID: ${CDP_API_KEY_ID:?CDP_API_KEY_ID is required}
      CDP_API_KEY_SECRET: ${CDP_API_KEY_SECRET:?CDP_API_KEY_SECRET is required}
      X402_EVAL_PRICE: ${X402_EVAL_PRICE:-$0.05}
      NEXT_PUBLIC_APP_URL: ${SWARM_PUBLIC_URL:?SWARM_PUBLIC_URL is required}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      SWARM_MODEL: ${SWARM_MODEL:-}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    networks:
      - private
      - edge
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/swarm').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    cpus: 2.0
    mem_limit: 1536m

  cloudflared:
    <<: *runtime
    image: cloudflare/cloudflared:2026.2.0
    command:
      - tunnel
      - --config
      - /etc/cloudflared/config.yml
      - run
    user: 65532:65532
    depends_on:
      oracle:
        condition: service_healthy
      swarm:
        condition: service_healthy
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    networks:
      - private
      - edge
    cpus: 0.5
    mem_limit: 256m

networks:
  private:
    driver: bridge
    internal: true
  edge:
    driver: bridge
